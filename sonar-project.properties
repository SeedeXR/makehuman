sonar.projectKey=makehuman
sonar.projectName=MakeHuman C++
sonar.projectVersion=2.0.0

# ---------------------------------------------------------------------------
# READ THIS BEFORE TRUSTING A GREEN GATE.
#
# This SonarQube is **Community Edition**, and Community ships NO C or C++
# analyser -- CFamily is Developer Edition and above. Verified against this
# server, not assumed:
#
#   GET /api/languages/list -> azureresourcemanager, cloudformation, cs, css,
#   docker, flex, go, ipynb, java, js, json, jsp, kotlin, kubernetes, php, py,
#   ruby, rust, scala, secrets, terraform, text, ts, vbnet, web, xml, yaml
#
# No `cpp`, no `c`. So a passing quality gate here says NOTHING about the ~60k
# lines of C++23 that are the actual project. What it DOES cover:
#
#   * `py`      -- tools/ and benchmarks/, which gate three CI jobs
#   * `yaml`    -- .github/workflows
#   * `secrets` -- every indexed file, which is why src/ and include/ are in
#                  sonar.sources despite having no analyser: a committed
#                  credential is worth catching wherever it lands
#   * `json`, `xml`, `text`
#
# The C++ gates remain clang -Wall -Wextra -Wpedantic -Werror -Wconversion,
# ctest in four presets, ASan and TSan. Those are the real ones.
# ---------------------------------------------------------------------------

sonar.sources=src,include,tools,benchmarks,cmake,.github,CMakeLists.txt
sonar.tests=tests

# legacy/python is the frozen Python reference -- an ORACLE we compare against
# and never edit (CLAUDE.md rule 2). Analysing it would flood the gate with
# findings nobody is permitted to act on.
#
# data/ is 136 MB of CC0 assets, graphify-out/ a generated knowledge graph,
# build/ and .venv-mh/ are build products.
sonar.exclusions=build/**,legacy/**,data/**,graphify-out/**,.venv-mh/**,**/*.qsb

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Suppressions, each with a reason. Nothing here is silenced for being
# inconvenient.
#
# `tools/capture_fixture.py` and `benchmarks/baseline_python_core.py` drive the
# legacy Python reference headlessly, which means STUBBING ITS API: methods
# named `getRestposeCoordinates`, `callAsync`, `addSetting`, fields named
# `zoomFactor`, `modelCamera`, `saveHandlers`. Those names are the reference's,
# not ours, and renaming them to snake_case would simply stop the stubs
# matching -- 36 of the 70 findings on the first scan were this one thing.
#
# The empty bodies (S1186) and unused parameters (S1172) are the same story: a
# stub exists to satisfy a signature the reference calls.
sonar.issue.ignore.multicriteria=stubnames,stubfields,stublocals,stubempty,stubargs,asciiclass

sonar.issue.ignore.multicriteria.stubnames.ruleKey=python:S100
sonar.issue.ignore.multicriteria.stubnames.resourceKey=**/capture_fixture.py
sonar.issue.ignore.multicriteria.stubfields.ruleKey=python:S116
sonar.issue.ignore.multicriteria.stubfields.resourceKey=**/capture_fixture.py
sonar.issue.ignore.multicriteria.stublocals.ruleKey=python:S117
sonar.issue.ignore.multicriteria.stublocals.resourceKey=**/capture_fixture.py
sonar.issue.ignore.multicriteria.stubempty.ruleKey=python:S1186
sonar.issue.ignore.multicriteria.stubempty.resourceKey=**/capture_fixture.py
sonar.issue.ignore.multicriteria.stubargs.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.stubargs.resourceKey=**/capture_fixture.py

# python:S6353 asks for `\w` in place of `[A-Za-z0-9_]` when parsing Mixamo bone
# names. REJECTED, not deferred: Python's `\w` is Unicode-aware by default, so
# it would also match accented and non-Latin letters. The class is deliberately
# ASCII and saying so is the point. The reason is in the source at the call
# site too, so this suppression is never the only record of it.
sonar.issue.ignore.multicriteria.asciiclass.ruleKey=python:S6353
sonar.issue.ignore.multicriteria.asciiclass.resourceKey=**/mixamo_mapping.py
